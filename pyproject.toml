[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thewatcher"
version = "3.0.0"
description = "Fast, single-file async TCP port scanner (CLI only)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "The Watcher" }]
keywords = ["port-scanner", "network", "security", "cli", "async", "recon"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Networking",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
thewatcher = "thewatcher:main"

[project.urls]
Homepage = "https://github.com/khalidsh3/thewatcher"
Issues = "https://github.com/khalidsh3/thewatcher/issues"
Source = "https://github.com/khalidsh3/thewatcher"

[tool.setuptools]
py-modules = ["thewatcher"]
